# ============================================================
# Toploader Trading Co. — Nginx Security Headers
#
# OPTION A — As a snippet file (recommended):
#   1. Copy this file to: /etc/nginx/snippets/security-headers.conf
#   2. Add this line inside your server {} block:
#        include snippets/security-headers.conf;
#   3. Reload: sudo nginx -t && sudo systemctl reload nginx
#
# OPTION B — Paste directly into your server {} block
#   (see the full server block example at the bottom of this file)
# ============================================================


# ----------------------------------------------------------
# HSTS — force HTTPS for 1 year, all subdomains
# NOTE: Once deployed, browsers cache this for 1 year.
# Only enable after you're certain the site is HTTPS-only.
# To join the browser preload list, submit at:
#   https://hstspreload.org
# ----------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ----------------------------------------------------------
# Content Security Policy
# Breakdown of each directive:
#   default-src 'none'         — block anything not explicitly listed
#   script-src  'self'         — only load JS from this domain
#   style-src   'self'         — external CSS from this domain
#               'unsafe-inline'— allow style="" attributes (used throughout the site)
#               fonts.googleapis.com — Google Fonts CSS
#   font-src    fonts.gstatic.com — Google Fonts files
#   img-src     'self'         — images from this domain only
#   connect-src 'self'         — fetch/XHR from this domain only
#   frame-ancestors 'none'     — disallow framing this site (replaces X-Frame-Options)
#   base-uri    'self'         — prevent base tag injection attacks
#   form-action 'self'         — form submissions to this domain only
# ----------------------------------------------------------
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ----------------------------------------------------------
# X-Frame-Options — legacy fallback for older browsers
# (CSP frame-ancestors above handles modern browsers)
# ----------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# ----------------------------------------------------------
# X-Content-Type-Options — prevent MIME-type sniffing
# ----------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# ----------------------------------------------------------
# Referrer-Policy — send full URL for same-origin,
# only origin for cross-origin requests
# ----------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ----------------------------------------------------------
# Permissions-Policy — disable features this site doesn't use
# ----------------------------------------------------------
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;


